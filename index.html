<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Jar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: linear-gradient(180deg, #f4fbff 0%, #dceffc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #6f4354;
      touch-action: manipulation;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 42px 20px 28px;
      text-align: center;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .message {
      margin: 8px 0 22px;
      font-size: 16px;
      color: #9a6d7e;
    }

    .heart-zone {
      width: 78px;
      height: 72px;
      margin: 0 auto 12px;
      position: relative;
      z-index: 20;
    }

    .heart-source {
      width: 78px;
      height: 72px;
      display: grid;
      place-items: center;
      font-size: 64px;
      line-height: 1;
      color: #ed6688;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      filter: drop-shadow(0 6px 5px rgba(135, 65, 88, 0.18));
      transition: transform 0.18s ease, opacity 0.15s ease;
    }

    .heart-source:active {
      cursor: grabbing;
      transform: scale(1.08);
    }

    .heart-source.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .falling-heart {
      position: fixed;
      z-index: 30;
      display: grid;
      place-items: center;
      color: #ed6688;
      font-size: 64px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 6px 5px rgba(135, 65, 88, 0.18));
      animation: fallToJar 0.9s cubic-bezier(0.35, 0.05, 0.7, 1) forwards;
    }

    @keyframes fallToJar {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      45% {
        transform:
          translate(
            calc(var(--fall-x) * 0.35),
            calc(var(--fall-y) * 0.45)
          )
          rotate(12deg)
          scale(0.92);
      }

      82% {
        transform:
          translate(
            calc(var(--fall-x) * 0.88),
            calc(var(--fall-y) * 1.02)
          )
          rotate(-8deg)
          scale(0.77);
      }

      92% {
        transform:
          translate(
            var(--fall-x),
            calc(var(--fall-y) - 10px)
          )
          rotate(5deg)
          scale(0.72);
      }

      100% {
        transform:
          translate(var(--fall-x), var(--fall-y))
          rotate(var(--landing-rotation))
          scale(0.72);
      }
    }

    .hint {
      margin: 0 0 18px;
      font-size: 14px;
      color: #aa7b8c;
    }

    .jar-area {
      width: 280px;
      height: 310px;
      margin: 0 auto;
      position: relative;
    }

    .jar-neck {
      width: 170px;
      height: 30px;
      position: absolute;
      top: 0;
      left: 55px;
      z-index: 12;
      border: 7px solid rgba(128, 156, 172, 0.65);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.35);
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.7),
        0 3px 6px rgba(97, 121, 137, 0.12);
      pointer-events: none;
    }

    .jar {
      width: 240px;
      height: 270px;
      position: absolute;
      left: 20px;
      bottom: 0;
      overflow: hidden;
      border: 7px solid rgba(128, 156, 172, 0.55);
      border-top-width: 5px;
      border-radius: 35px 35px 70px 70px;
      background:
        linear-gradient(
          105deg,
          rgba(255, 255, 255, 0.62) 0%,
          rgba(255, 255, 255, 0.18) 30%,
          rgba(181, 222, 235, 0.15) 65%,
          rgba(255, 255, 255, 0.5) 100%
        );
      box-shadow:
        inset 12px 0 18px rgba(255, 255, 255, 0.7),
        inset -8px 0 14px rgba(125, 180, 198, 0.12),
        0 15px 25px rgba(112, 73, 87, 0.14);
    }

    .heart-pile {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .jar-heart {
      position: absolute;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: #ed6688;
      font-size: 48px;
      line-height: 1;
      transform: translate(-50%, -50%) rotate(var(--rotation));
      filter: drop-shadow(0 3px 3px rgba(135, 65, 88, 0.18));
      animation: settleHeart 0.28s ease-out;
    }

    @keyframes settleHeart {
      0% {
        transform:
          translate(-50%, -70%)
          rotate(var(--rotation))
          scale(0.9);
      }

      60% {
        transform:
          translate(-50%, -43%)
          rotate(var(--rotation))
          scale(1.05);
      }

      100% {
        transform:
          translate(-50%, -50%)
          rotate(var(--rotation))
          scale(1);
      }
    }

    .jar-highlight {
      width: 17px;
      height: 145px;
      position: absolute;
      top: 48px;
      left: 24px;
      z-index: 8;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.67);
      transform: rotate(3deg);
      pointer-events: none;
    }

    .jar-label {
      position: absolute;
      left: 50%;
      top: 95px;
      z-index: 9;
      transform: translateX(-50%) rotate(-2deg);
      width: 130px;
      padding: 9px 8px;
      border-radius: 8px;
      background: rgba(255, 248, 239, 0.82);
      border: 2px solid rgba(186, 144, 126, 0.32);
      color: #a16074;
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 3px 6px rgba(92, 57, 70, 0.08);
      pointer-events: none;
    }

    .counter {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 700;
      color: #79485b;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>My Heart Jar</h1>
    <p class="message">A little place for all of your wins.</p>

    <div class="heart-zone">
      <div
        class="heart-source"
        role="button"
        tabindex="0"
        aria-label="Add a heart"
      >
        ♥
      </div>
    </div>

    <p class="hint">Tap or drag the heart into the jar</p>

    <div class="jar-area">
      <div class="jar-neck"></div>

      <div class="jar">
        <div class="heart-pile"></div>
        <div class="jar-highlight"></div>
        <div class="jar-label">Good Things</div>
      </div>
    </div>

    <div class="counter" aria-live="polite">0 Hearts</div>
  </main>

  <script>
    const heartSource = document.querySelector('.heart-source');
    const jar = document.querySelector('.jar');
    const heartPile = document.querySelector('.heart-pile');
    const counter = document.querySelector('.counter');

    let heartCount = 0;
    let isAnimating = false;

    const landingSpots = [
      { x: 50, y: 88, rotation: -7 },
      { x: 30, y: 87, rotation: 9 },
      { x: 70, y: 86, rotation: -11 },
      { x: 18, y: 80, rotation: 7 },
      { x: 42, y: 79, rotation: -5 },
      { x: 62, y: 79, rotation: 10 },
      { x: 82, y: 80, rotation: -8 },
      { x: 27, y: 70, rotation: -10 },
      { x: 50, y: 69, rotation: 6 },
      { x: 73, y: 70, rotation: -4 },
      { x: 16, y: 61, rotation: 8 },
      { x: 38, y: 60, rotation: -7 },
      { x: 61, y: 60, rotation: 9 },
      { x: 83, y: 61, rotation: -10 }
    ];

    function updateCounter() {
      counter.textContent =
        heartCount === 1 ? '1 Heart' : heartCount + ' Hearts';
    }

    function addHeartToPile(spot) {
      const jarHeart = document.createElement('div');

      jarHeart.className = 'jar-heart';
      jarHeart.textContent = '♥';
      jarHeart.style.left = spot.x + '%';
      jarHeart.style.top = spot.y + '%';
      jarHeart.style.setProperty(
        '--rotation',
        spot.rotation + 'deg'
      );

      heartPile.appendChild(jarHeart);

      heartCount += 1;
      updateCounter();
    }

    function addHeart() {
      if (isAnimating) {
        return;
      }

      isAnimating = true;

      const sourceRect = heartSource.getBoundingClientRect();
      const jarRect = jar.getBoundingClientRect();

      const spot =
        landingSpots[heartCount % landingSpots.length];

      const destinationX =
        jarRect.left + jarRect.width * (spot.x / 100);

      const destinationY =
        jarRect.top + jarRect.height * (spot.y / 100);

      const fallingHeart = document.createElement('div');

      fallingHeart.className = 'falling-heart';
      fallingHeart.textContent = '♥';
      fallingHeart.style.left = sourceRect.left + 'px';
      fallingHeart.style.top = sourceRect.top + 'px';
      fallingHeart.style.width = sourceRect.width + 'px';
      fallingHeart.style.height = sourceRect.height + 'px';

      fallingHeart.style.setProperty(
        '--fall-x',
        destinationX -
          sourceRect.left -
          sourceRect.width / 2 +
          'px'
      );

      fallingHeart.style.setProperty(
        '--fall-y',
        destinationY -
          sourceRect.top -
          sourceRect.height / 2 +
          'px'
      );

      fallingHeart.style.setProperty(
        '--landing-rotation',
        spot.rotation + 'deg'
      );

      document.body.appendChild(fallingHeart);
      heartSource.classList.add('hidden');

      fallingHeart.addEventListener(
        'animationend',
        function () {
          fallingHeart.remove();
          addHeartToPile(spot);
          heartSource.classList.remove('hidden');
          isAnimating = false;
        },
        { once: true }
      );
    }

    heartSource.addEventListener('click', addHeart);

    heartSource.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        addHeart();
      }
    });
  </script>
</body>
</html>
